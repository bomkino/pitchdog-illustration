name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Rebuild reference receipts
        run: |
          python scripts/build_asset_manifest.py
          git diff --exit-code -- skills/pitchdog-illustration/assets/reference-manifest.json skills/pitchdog-illustration/assets/REFERENCE-PACK.sha256
      - name: Validate repository
        run: python scripts/validate_skill.py
      - name: OpenAI quick validator
        run: |
          git clone --filter=blob:none https://github.com/openai/skills.git /tmp/openai-skills
          git -C /tmp/openai-skills checkout 49f948faa9258a0c61caceaf225e179651397431
          python /tmp/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py skills/pitchdog-illustration
      - name: Package and round trip
        run: python scripts/package_skill.py
      - name: Verify twin archives
        run: |
          cmp dist/pitchdog-illustration.zip dist/pitchdog-illustration.skill
          (cd dist && sha256sum -c SHA256SUMS)
